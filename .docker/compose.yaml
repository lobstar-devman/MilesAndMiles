#https://docs.docker.com/compose/how-tos/environment-variables/envvars/
name: ${CONTAINER_NAME}

services:
    app:
        depends_on:
            - postgres
        build:
            dockerfile: Dockerfile-app
            target: final-dev-image
            args:
              #Note: To reference a value from the local .env file use: ${ENVVAR}            
              APP_REPO: ${APP_REPO}
              IMAGE_MODE: ${IMAGE_MODE}

            ##
            # https://docs.docker.com/build/building/secrets/
            ##
            #secrets:
            #    # Note that support for uid, gid, and mode attributes are not implemented in Docker Compose when 
            #    # the source of the secret is a file. This is because bind-mounts used under the hood don't allow uid remapping.            
            secrets:
                - github_ssh

        ports:
            - "8080:8080"
            - "9000:9000"

        environment:
            #used in /entrypoint
            - GITHUB_USERNAME
            - GITHUB_EMAIL
            - APP_REPO
            - APP_BRANCH        
            - IMPORT_DATABASE

            # Laravel envvars
            - APP_ENV=local
            - APP_DEBUG=true
            - APP_URL
            - APP_KEY
            - DB_CONNECTION=pgsql
            - DB_URL=postgresql://${PGUSER}:${PGPWD}@postgres/${PGUSER}
            - TEST_DATABASE_URL=postgresql://${PGUSER}:${PGPWD}@testdb:5432/${PGUSER}

            # psql envars
            - PGHOST=postgres
            - PGUSER=${PGUSER}
            - PGPASSWORD=${PGPWD}
            - PGDATABASE=${PGUSER}

        secrets:
            # Github ssh key
            - source: github_ssh
              target: /etc/ssh/id_rsa_github

        # Override docker-php-entrypoint in /usr/local/bin/docker-php-entrypoint
        entrypoint: /entrypoint --entrypoint docker-php-entrypoint
        command: apache2-foreground --

