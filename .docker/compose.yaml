    ##
    # In the admin login screen use the following:
    # System: Postgres
    # Server: postgres:5432
    # Username: <POSTGRES_USER> or postgres if not set
    # Password: <POSTGRES_PASSWORD> (see POSTGRES_PASSWORD in postgres service)
    ##
    adminer:
        depends_on:
            - postgres
        image: adminer
        restart: unless-stopped
        environment:
            #- ADMINER_DEFAULT_SERVER=postgres
            - POSTGRES_PASSWORD=${PGPWD}
            - POSTGRES_USER=${PGUSER}
        ports:
            - 8085:8080        
        volumes:
            - ./adminer:/var/www/html/plugins-enabled

